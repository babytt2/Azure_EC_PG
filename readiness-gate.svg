<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <style>
      .bg{fill:#0e1728}.txt{fill:#e8f0ff;font-family:Segoe UI,Arial,sans-serif}
      .title{font-size:30px;font-weight:700}.box{fill:#101d33;stroke:#2f4670;stroke-width:2}
      .h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#b8c8e6}
      .ok{fill:#59d499}.warn{fill:#ffd166}.bad{fill:#ff7b7b}
    </style>
  </defs>
  <rect class="bg" width="1400" height="620" rx="20"/>
  <text x="60" y="70" class="txt title">서비스 재개 검증 게이트 (Reconnect 후 필수 확인)</text>

  <rect x="80" y="120" width="240" height="170" rx="12" class="box"/>
  <text x="100" y="165" class="txt h">1. Cluster Ready</text>
  <text x="100" y="200" class="txt b">- Async success</text>
  <text x="100" y="228" class="txt b">- Node version</text>
  <text x="100" y="256" class="txt b">- Resource health</text>

  <rect x="360" y="120" width="300" height="170" rx="12" class="box"/>
  <text x="380" y="165" class="txt h">2. Metadata / Shard</text>
  <text x="380" y="200" class="txt b">- Shard placement</text>
  <text x="380" y="228" class="txt b">- Colocation</text>
  <text x="380" y="256" class="txt b">- Reference table</text>

  <rect x="700" y="120" width="300" height="170" rx="12" class="box"/>
  <text x="720" y="165" class="txt h">3. Data Consistency</text>
  <text x="720" y="200" class="txt b">- Read/Write probe</text>
  <text x="720" y="228" class="txt b">- COMMIT visibility</text>
  <text x="720" y="256" class="txt b">- Row count checks</text>

  <rect x="1040" y="120" width="280" height="170" rx="12" class="box"/>
  <text x="1060" y="165" class="txt h">4. Auth / App SLO</text>
  <text x="1060" y="200" class="txt b">- Entra 신규 로그인</text>
  <text x="1060" y="228" class="txt b">- Latency/error rate</text>
  <text x="1060" y="256" class="txt b">- Timeout recovery</text>

  <line x1="200" y1="345" x2="1200" y2="345" stroke="#456394" stroke-width="3" stroke-dasharray="10,8"/>
  <text x="85" y="335" class="txt b">모든 게이트 통과 필요</text>

  <rect x="430" y="390" width="540" height="150" rx="14" fill="#1a2842" stroke="#59d499" stroke-width="3"/>
  <text x="455" y="440" class="txt h">✅ 재개 조건 충족 시에만 Write 트래픽 단계적 오픈</text>
  <text x="455" y="474" class="txt b">Reconnect만 확인하고 즉시 재개하면 데이터/인증 이슈가 남을 수 있음</text>
  <text x="455" y="504" class="txt b">운영 기준: Reconnect ≠ Ready</text>

  <circle cx="255" cy="345" r="10" class="warn"/>
  <circle cx="535" cy="345" r="10" class="warn"/>
  <circle cx="875" cy="345" r="10" class="warn"/>
  <circle cx="1170" cy="345" r="10" class="warn"/>
</svg>

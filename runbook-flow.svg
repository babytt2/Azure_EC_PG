<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <style>
      .bg{fill:#0e1728}.txt{fill:#e8f0ff;font-family:Segoe UI,Arial,sans-serif}
      .title{font-size:30px;font-weight:700}.box{stroke-width:2;rx:14;ry:14}
      .h{font-size:24px;font-weight:700}.b{font-size:18px;fill:#c0cfea}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ea5de"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="520" rx="20"/>
  <text x="60" y="70" class="txt title">MVU 운영 Runbook (사전 → 진행 → 사후)</text>

  <rect x="80" y="130" width="370" height="280" class="box" fill="#13233d" stroke="#3b5c8f"/>
  <text x="105" y="180" class="txt h">사전 준비</text>
  <text x="105" y="220" class="txt b">• Inventory 수집</text>
  <text x="105" y="250" class="txt b">• Blocker pre-check</text>
  <text x="105" y="280" class="txt b">• Rehearsal + Probe</text>
  <text x="105" y="310" class="txt b">• authConfig 포함 요청 준비</text>

  <rect x="515" y="130" width="370" height="280" class="box" fill="#2a2340" stroke="#6d5aa0"/>
  <text x="540" y="180" class="txt h">업그레이드 진행</text>
  <text x="540" y="220" class="txt b">• Application Write 중지</text>
  <text x="540" y="250" class="txt b">• Async + Resource 상태 추적</text>
  <text x="540" y="280" class="txt b">• 요청~Ready 전체 구간 관리</text>
  <text x="540" y="310" class="txt b">• Reconnect 즉시 재개 금지</text>

  <rect x="950" y="130" width="370" height="280" class="box" fill="#18362f" stroke="#3f8e7d"/>
  <text x="975" y="180" class="txt h">사후 검증</text>
  <text x="975" y="220" class="txt b">• Version / Metadata / Shard 확인</text>
  <text x="975" y="250" class="txt b">• Consistency + Entra 로그인 검증</text>
  <text x="975" y="280" class="txt b">• Query plan / latency 점검</text>
  <text x="975" y="310" class="txt b">• 단계적 Write 재개</text>

  <line x1="450" y1="270" x2="510" y2="270" stroke="#7ea5de" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="885" y1="270" x2="945" y2="270" stroke="#7ea5de" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="470" y="450" class="txt b">운영 원칙: Reconnect ≠ Ready / 검증 완료 후 재개</text>
</svg>

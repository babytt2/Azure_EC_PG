<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <style>
      .bg{fill:#0e1728}.line{stroke:#36507c;stroke-width:8}.txt{fill:#e8f0ff;font-family:Segoe UI,Arial,sans-serif}
      .muted{fill:#9fb0cc;font-size:20px}.cap{font-size:28px;font-weight:700}.small{font-size:18px}
    </style>
  </defs>
  <rect class="bg" width="1400" height="520" rx="20"/>
  <text x="60" y="70" class="txt cap">MVU 실측 타임라인 (PPTX 기반 재구성)</text>
  <line x1="80" y1="290" x2="1320" y2="290" class="line"/>

  <circle cx="140" cy="290" r="14" fill="#56b6ff"/>
  <text x="90" y="350" class="txt small">요청 시작</text>
  <text x="86" y="380" class="muted">T+00:00</text>

  <rect x="240" y="250" width="430" height="80" rx="14" fill="#ff7b7b" opacity="0.9"/>
  <text x="262" y="302" class="txt cap" style="font-size:26px">Direct DB outage ~420s</text>

  <rect x="700" y="255" width="300" height="70" rx="14" fill="#ffd166"/>
  <text x="722" y="300" class="txt cap" style="font-size:24px;fill:#2a1900">PgBouncer outage 261.5s</text>

  <circle cx="1060" cy="290" r="14" fill="#59d499"/>
  <text x="1012" y="350" class="txt small">DB reconnect</text>
  <text x="1012" y="380" class="muted">Ready 전 구간 존재</text>

  <circle cx="1230" cy="290" r="14" fill="#56b6ff"/>
  <text x="1176" y="350" class="txt small">Resource Ready</text>
  <text x="1168" y="380" class="muted">요청 후 약 17분</text>

  <rect x="980" y="130" width="300" height="70" rx="12" fill="#ff7b7b" opacity="0.85"/>
  <text x="1006" y="174" class="txt cap" style="font-size:23px">Entra login 장애 ~383s</text>

  <text x="60" y="460" class="muted">핵심: 연결 재개 시점과 운영 재개 시점은 다를 수 있으며, Reconnect ≠ Ready</text>
</svg>
